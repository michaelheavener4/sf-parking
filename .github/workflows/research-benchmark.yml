name: research-benchmark

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Benchmark script to run
        required: false
        default: scripts/benchmark_blockface_transaction_dynamics_v4.py
      max_test_rows:
        description: Maximum target rows per fold
        required: false
        default: '50000'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.RESEARCH_DATABASE_URL }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run unit tests first
        run: python -m pytest -q
      - name: Validate research database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo 'RESEARCH_DATABASE_URL is not configured.'
            echo 'A benchmark without the historical database would be invalid.'
            exit 1
          fi
      - name: Verify research database
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          import pg8000
          u = urlparse(os.environ['DATABASE_URL'])
          conn = pg8000.connect(host=u.hostname, port=u.port or 5432,
                                user=u.username, password=u.password,
                                database=u.path.lstrip('/'))
          cur = conn.cursor()
          cur.execute("SELECT current_database(), current_timestamp")
          print(cur.fetchone())
          cur.close(); conn.close()
          PY
      - name: Run causal dynamics benchmark
        run: python "${{ inputs.benchmark }}" --max-test-rows "${{ inputs.max_test_rows }}"
      - name: Collect research reports
        if: always()
        run: |
          mkdir -p research-artifacts
          find models -maxdepth 1 -type f -name '*.json' -newermt '10 minutes ago' -exec cp {} research-artifacts/ \; || true
          python - <<'PY' > research-artifacts/environment.txt
          import platform, sys
          print(platform.platform())
          print(sys.version)
          PY
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf-parking-research-${{ github.run_number }}
          path: research-artifacts/
          if-no-files-found: warn
          retention-days: 30
