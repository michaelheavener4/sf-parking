[project]
name = "sf-parking"
version = "0.1.0"
description = "Parking intelligence for San Francisco"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic-settings>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

target-version = "py311"
